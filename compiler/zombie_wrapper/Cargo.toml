[package]
name = "zombie_wrapper"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "zombie_rustc"
path = "src/main.rs"

[dependencies]
libzombie = { path = "../libzombie" }
libp2p = { version = "0.53", features = ["gossipsub", "mdns", "noise", "tcp", "yamux", "macros", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
sha2 = "0.10"
