[package]
name = "usage_eigenmatrix"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[[bin]]
name = "observe_bits"
path = "observe_bits.rs"

[[bin]]
name = "prime_sieve_table"
path = "src/bin/prime_sieve_table.rs"

[[bin]]
name = "clean_graph_interpreter"
path = "src/bin/clean_graph_interpreter.rs"

[[bin]]
name = "syn_prime_analyzer"
path = "src/bin/syn_prime_analyzer.rs"

[[bin]]
name = "uncontainable_meme"
path = "src/bin/uncontainable_meme.rs"

[[bin]]
name = "flexible_scp_system"
path = "src/bin/flexible_scp_system.rs"

[[bin]]
name = "recursive_ast_classifier"
path = "src/bin/recursive_ast_classifier.rs"

[[bin]]
name = "mkscp_macro_set"
path = "src/bin/mkscp_macro_set.rs"

[[bin]]
name = "meta_bootstrap_driver"
path = "src/bin/meta_bootstrap_driver.rs"

[[bin]]
name = "signature_reproducer"
path = "src/bin/signature_reproducer.rs"

[[bin]]
name = "syn_monster_analyzer"
path = "src/bin/syn_monster_analyzer.rs"

[[bin]]
name = "defid_24bit_mapper"
path = "src/bin/defid_24bit_mapper.rs"

[[bin]]
name = "ecosystem_addressing"
path = "src/bin/ecosystem_addressing.rs"

[[bin]]
name = "module_semantic_addressing"
path = "src/bin/module_semantic_addressing.rs"

[[bin]]
name = "size_lattice_allocator"
path = "src/bin/size_lattice_allocator.rs"

[[bin]]
name = "complexity_memory_allocator"
path = "src/bin/complexity_memory_allocator.rs"

[[bin]]
name = "address_assignment_analyzer"
path = "src/bin/address_assignment_analyzer.rs"

[[bin]]
name = "meaningful_address_analyzer"
path = "src/bin/meaningful_address_analyzer.rs"

[[bin]]
name = "arrow_partition_analyzer"
path = "src/bin/arrow_partition_analyzer.rs"

[[bin]]
name = "system_g_driver"
path = "src/bin/system_g_driver.rs"

[[bin]]
name = "system_g_collector"
path = "src/bin/system_g_collector.rs"

[[bin]]
name = "sparse_arrow_allocator"
path = "src/bin/sparse_arrow_allocator.rs"

[[bin]]
name = "rustc_reproduction_test"
path = "src/bin/rustc_reproduction_test.rs"

[[bin]]
name = "dynamic_model"
path = "src/bin/dynamic_model.rs"

[[bin]]
name = "prime_constant_compiler"
path = "src/bin/prime_constant_compiler.rs"

[[bin]]
name = "self_mapping_compiler"
path = "src/bin/self_mapping_compiler.rs"

[[bin]]
name = "unified_compiler_driver"
path = "src/bin/unified_compiler_driver.rs"

[[bin]]
name = "collision_accountant"
path = "src/bin/collision_accountant.rs"

[[bin]]
name = "module_scrubber"
path = "src/bin/module_scrubber.rs"

[[bin]]
name = "collision_analyzer"
path = "src/bin/collision_analyzer.rs"

[features]
default = []
wasm = ["wasm-bindgen"]

[dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
paste = "1.0"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.8"
wasm-bindgen = { version = "0.2", optional = true }
