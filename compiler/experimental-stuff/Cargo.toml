[package]
name = "experimental-stuff"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
jsonschema = "0.18"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
rand = "0.8"
toml = "0.8"
walkdir = "2.0"
introspector-collector = { path = "../introspector-collector" }
