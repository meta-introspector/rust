[package]
name = "zombie_client"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "zombie_client"
path = "src/main.rs"

[dependencies]
libp2p = { version = "0.53", features = ["gossipsub", "mdns", "noise", "tcp", "yamux", "macros", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
