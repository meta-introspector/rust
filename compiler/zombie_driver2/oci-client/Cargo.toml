[package]
name = "oci-rust-client"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "list_deployments_oci"
path = "src/list_deployments_oci.rs"

[[bin]]
name = "list_deployments"
path = "src/list_deployments.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
sha2 = "0.10"
rsa = "0.9"
chrono = { version = "0.4", features = ["serde"] }
oci-api = "0.5"
serde_yaml = "0.9"
rand = "0.8"
ssh-key = "0.6"
anyhow = "1.0"
[[bin]]
name = "show_headers"
path = "src/show_headers.rs"
[[bin]]
name = "test_simple"
path = "src/test_simple.rs"
[[bin]]
name = "standalone_signer"
path = "src/standalone_signer.rs"
