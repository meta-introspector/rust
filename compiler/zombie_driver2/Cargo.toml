[dependencies]
rand = "0.8"
goblin = "0.8"
libloading = "0.8"
libp2p = { version = "0.53", features = ["gossipsub", "mdns", "tcp", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
nalgebra = "0.33"
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
warp = "0.3"
rustc-demangle = "0.1"
chrono = { version = "0.4", features = ["serde"] }
quote = "1.0"
lib-zombie = { path = "lib-zombie" }
arrow = "53.0"
parquet = "53.0"
syn-analyzer = { path = "syn-analyzer" }
libc = "0.2.180"
nix = "0.27"

[build-dependencies]
cc = "1.0"
