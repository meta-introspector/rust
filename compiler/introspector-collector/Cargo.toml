[package]
name = "introspector-collector"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clean_collector"
path = "src/clean_collector.rs"

[[bin]]
name = "enhanced_collector"
path = "src/enhanced_collector.rs"

[[bin]]
name = "working_usage_collector"
path = "src/working_usage_collector.rs"

[[bin]]
name = "working_collector"
path = "src/working_collector.rs"

[[bin]]
name = "simple_collector"
path = "src/simple_collector.rs"

[[bin]]
name = "enum_usage_collector"
path = "src/enum_usage_collector.rs"

[[bin]]
name = "read_manifest_tree"
path = "src/bin/read_manifest_tree.rs"

[[bin]]
name = "validate_schema"
path = "src/bin/validate_schema.rs"

[[bin]]
name = "profile_driven_compiler"
path = "src/bin/profile_driven_compiler.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
jsonschema = "0.18"
chrono = { version = "0.4", features = ["serde"] }
rustc_index = { path = "../../compiler/rustc_index" }
build_common = { path = "../build_common" }
analyzeme = { path = "../../../measureme/analyzeme" }
